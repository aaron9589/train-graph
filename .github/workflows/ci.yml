name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # npm ci skips optional platform-specific packages not recorded in the
        # lockfile (e.g. @rollup/rollup-linux-x64-gnu on macOS-generated lockfiles),
        # causing Rollup to fail at build time. npm install respects the lockfile
        # for all pinned deps but correctly resolves optional platform packages.
        run: npm install

      - name: Typecheck & build client
        run: npm run build --workspace=client
