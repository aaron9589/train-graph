name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # npm has a known bug (https://github.com/npm/cli/issues/4828) where
        # optional platform-specific packages (e.g. @rollup/rollup-linux-x64-gnu)
        # are not installed when a lockfile generated on a different platform is
        # present, even with plain npm install. Removing the lockfile first is the
        # recommended workaround. The npm cache (restored above) still makes this fast.
        run: rm -f package-lock.json && npm install

      - name: Typecheck & build client
        run: npm run build --workspace=client
